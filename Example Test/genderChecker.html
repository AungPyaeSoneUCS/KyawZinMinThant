<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Checker</title>
</head>
<body>

    <h1>Gender Checker</h1>

    <input type="text" id="nameInput" placeholder="Enter a name" required>

    <button onclick="checkGender()"> Check Gender </button>

    <p id="result"></p>

    <script>

        function checkGender() {
            const nameInput = document.getElementById('nameInput').value.trim();
            const resultElement = document.getElementById('result');

            if (nameInput === '') {
                resultElement.textContent = 'Please enter a name.';
                resultElement.style.color = 'red';
                return;
            }

            const firstWord = nameInput.split(' ')[0].toLowerCase();

            if (firstWord === "mg" || firstWord === "u") {

                resultElement.textContent = 'The name is  male.';
                resultElement.style.color = 'blue';
            } else if (firstWord === "ma" || firstWord === "daw") {
                resultElement.textContent = 'The name is  female.';
                resultElement.style.color = 'pink';
            } else {
                resultElement.textContent = 'Gender could not be determined from the name.';
                resultElement.style.color = 'orange';

            }




        }
    </script>
    
</body>
</html>
