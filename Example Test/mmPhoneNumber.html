<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Phone Operator Validator</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #183b35;
            --muted: #607a73;
            --green: #18735b;
            --green-dark: #105541;
            --line: #d5e5dd;
            --paper: #fffefa;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background-color: #eef5ef;
            background-image: radial-gradient(#c9ded2 0.8px, transparent 0.8px);
            background-size: 22px 22px;
        }

        main {
            width: min(100%, 520px);
            padding: clamp(28px, 7vw, 52px);
            border: 1px solid rgba(24, 59, 53, .1);
            border-radius: 18px;
            background: var(--paper);
            box-shadow: 0 24px 70px rgba(24, 59, 53, .12);
            animation: arrive .55s ease-out both;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 12ch;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 8vw, 48px);
            font-weight: 500;
            line-height: 1.08;
        }

        .description {
            margin: 16px 0 32px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 700;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        input {
            min-width: 0;
            min-height: 50px;
            flex: 1;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 5px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            transition: border-color .18s, box-shadow .18s;
        }

        input::placeholder { color: #8a9b94; }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(24, 115, 91, .14);
        }

        button {
            min-height: 50px;
            padding: 0 18px;
            border: 0;
            border-radius: 5px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .18s, transform .18s;
        }

        button:hover { background: var(--green-dark); transform: translateY(-1px); }
        button:focus-visible { outline: 3px solid #8bbca8; outline-offset: 3px; }

        #result {
            margin: 20px 0 0;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        #result:empty { display: none; }

        #result.result-success,
        #result.result-error {
            padding: 12px 14px;
            border: 1px solid;
            border-radius: 5px;
        }

        #result.result-success {
            border-color: #a9d9bf;
            background: #eaf7ef;
            color: #17643d;
        }

        #result.result-error {
            border-color: #efb7b2;
            background: #fff0ee;
            color: #a12e28;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 440px) {
            body { padding: 18px 14px; }
            .form-row { flex-direction: column; }
            button { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Myanmar · Mobile networks</p>
        <h1>Find your phone operator.</h1>
        <p class="description">Enter a Myanmar mobile number to identify its network.</p>

        <label for="phoneNumber">Phone number</label>
        <div class="form-row">
            <input type="tel" id="phoneNumber" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxxx">
            <button onclick="checkOperator()">Check operator</button>
        </div>
        <p id="result" aria-live="polite"></p>
    </main>

    <script>

        function checkOperator() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const resultElement = document.getElementById('result');
            const showResult = (message, isValid = false) => {
                resultElement.textContent = message;
                resultElement.className = isValid ? 'result-success' : 'result-error';
            };

            if (!phoneNumber) {
                showResult('Please enter a phone number.');
                return;
            }

            if(!phoneNumber.startsWith('09')) {
                showResult('Please enter a valid Myanmar phone number starting with 09.');
                return;
            }

            const expectedLength = phoneNumber.startsWith('095') ? 10 : 11;
            if (phoneNumber.length !== expectedLength) {
                showResult(`Please enter a ${expectedLength}-digit phone number.`);
                return;
            }

            let operator = "Unknown Operator";

            if (phoneNumber.startsWith("097")) {
                operator = "ATOM";
            } else if (phoneNumber.startsWith("099")) {
                operator = "Ooredoo";
            } else if (phoneNumber.startsWith("096")) {
                operator = "Mytel";
            } else if (phoneNumber.startsWith("093")) {
                operator = "MEC Tel";
            } else if (
                phoneNumber.startsWith("092") || 
                phoneNumber.startsWith("094") || 
                phoneNumber.startsWith("095") || 
                phoneNumber.startsWith("098")
            ) {
                operator = "MPT";
            }
            const isValid = operator !== "Unknown Operator";
            showResult(`The operator for ${phoneNumber} is: ${operator}`, isValid);
        }
            

           
    </script>

</body>
</html>
